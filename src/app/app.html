<div class="todo-card__container">
  <h1 class="todo-card__title">Todo List</h1>
  <app-input-button-unit
    (addTask)="todoListService.addTodoItem($event)"
    class="todo-card__task-input"
  ></app-input-button-unit>
  @if(todoListService.todoList().length === 0) {
  <p class="todo-card__empty-message">No tasks available. Add a task to get started!</p>
  }@else{
  <div class="todo-card__list" [style.height.px]="todoListService.todoList().length * todoItemSize">
    @for(item of todoListService.todoList(); track item.id) {
    <app-todo-item
      [task]="item.title"
      [checked]="item.checked"
      (toggleTask)="todoListService.toggleTodoItem(item.id)"
      (deleteTask)="todoListService.removeTodoItem(item.id)"
      (editTask)="todoListService.editTodoItem(item.id, $event)"
      animate.enter="enter-animation"
      animate.leave="leave-animation"
    ></app-todo-item>
    }
  </div>
  }
</div>
